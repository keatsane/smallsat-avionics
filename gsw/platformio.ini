; ground station - adafruit feather m0 with the rfm95 lora radio on board
; build: just gsw-build   flash: just gsw-flash
;
; the feather replaces the teensy the plan used to name: the radio is already on it, the spi bus
; is free for the nrf24, i2c is free for the display, and it is its own usb serial port. a teensy
; would have meant wiring a second rfm95 to gain nothing.

[env:gsw]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino

; frame.cpp needs std::optional; the arduino core defaults to gnu++11 here
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I../common
    -Wall
    -Wextra
    ; the usb descriptor strings, so the port introduces itself instead of enumerating as a
    ; generic "USB Serial Device". windows may keep the generic driver label in some views, but
    ; anything reading the device descriptors sees the real name
    -DUSB_MANUFACTURER='"SSAV-1"'
    -DUSB_PRODUCT='"Ground Station"'

; the same wire contract the satellite uses, compiled rather than reimplemented. a ground station
; with its own hand-written decoder is a second definition of the protocol, and the two drift the
; first time a message changes - this is the arrangement fsw/CMakeLists.txt has always described
build_src_filter =
    +<*>
    +<../../common/protocol/frame.cpp>

; the ssd1306 readout. a library rather than a hand-rolled driver, same call the esc node makes
; for simplefoc - writing a display driver from scratch buys nothing here
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

monitor_speed = 115200
