; reaction-wheel node - b-g431b-esc1 (stm32g431cb)
; build: just esc-build   flash: just esc-flash

[env:esc]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino

; frame.cpp needs std::optional; the arduino core defaults to gnu++14
build_unflags = -std=gnu++14
; -Wall/-Wextra but deliberately not -Werror: these flags reach simplefoc and the arduino core
; too, and failing this node's build on warnings from vendored code is not a useful signal
build_flags =
    -std=gnu++17
    -I../common
    -Wall
    -Wextra

; share the wire contract with the obc rather than copying it
build_src_filter =
    +<*>
    +<../../common/protocol/frame.cpp>

lib_deps = askuric/Simple FOC

; simplefoc's stm32 backend overrides weak fallbacks in generic_mcu.cpp. archived, the linker
; never pulls those objects in - 6-pwm init then fails silently through the generic stub
lib_archive = no

monitor_speed = 115200

; pin the esc's own st-link - with the nucleo plugged in too, an unpinned upload can land on
; the wrong board. this is the serial of the board on the bench, so a board swap changes it:
; `STM32_Programmer_CLI -l` prints the serial of whatever is plugged in
upload_flags = -c
    adapter serial 066FFF525266555067054437
