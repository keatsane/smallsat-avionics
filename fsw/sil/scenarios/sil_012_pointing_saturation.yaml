# what a reaction wheel runs out of, and what the vehicle does about it (REQ-ADCS-003).
#
# the platform is held in POINTING and then shoved steadily - a hand on the rig rather than a
# tap. the controller responds correctly and the wheel absorbs the momentum, which is exactly
# what it is for, right up until it has absorbed all it can hold. from there the vehicle has no
# authority at all: the error grows and nothing the control law does can shrink it.
#
# for a long time that was the whole scenario, and it ended with the vehicle still in POINTING,
# no faults set, straining at full torque with nothing happening - the rig showed exactly that on
# 2026-08-04, fifteen seconds of maximum command with the body rate pinned at zero. A failure
# nothing announces is a failure nobody can act on, which is why the requirement asks for a fault
# and not only a clamp.
#
# now the wheel's speed reaches the flight software (the shim reports it, the same way the ESC
# does on the rig), so three things happen in order and this grades all of them:
#
#   1. WHEEL_SATURATED latches once the wheel has sat at 90% of its limit for a full second.
#   2. Being Degraded, it retreats the steering modes to STANDBY - a full wheel disqualifies
#      POINTING for the same reason a missing one does: there is no actuator left.
#   3. STANDBY unwinds it. A real spacecraft dumps momentum against magnetorquers or thrusters;
#      this one dumps against its own bearing. Any torque under the platform's breakaway spins
#      the wheel down without moving the body at all, so the stiction that makes pointing hard on
#      this rig is exactly what makes the wheel rechargeable.
#
# that is why the retreat is to STANDBY rather than SAFE: STANDBY is where the cure lives, so the
# fallback is a recovery rather than a parking space. The fault stays latched for the ground to
# clear (REQ-FAULT-010), because a vehicle that silently re-arms hides how often it ran out.
id: SIL-012
title: a saturated wheel is announced, retreats the vehicle, and is unwound in standby
verifies: [REQ-ADCS-003]
timeline:
  - { t: 0, plant: 0.0 }
  - { t: 100, cmd: { name: SET_MODE, arg: 1, seq: 1 } }
  - { t: 200, cmd: { name: SET_MODE, arg: 2, seq: 2 } }
  - { t: 300, cmd: { name: SET_MODE, arg: 3, seq: 3 } }
  # four shoves of 0.5 rad/s. the wheel's whole momentum budget is 0.87 rad/s of platform rate,
  # so this is a bit over twice what the vehicle can hold - a firm push, not an absurd one
  - { t: 400, nudge: 0.5 }
  - { t: 500, nudge: 0.5 }
  - { t: 600, nudge: 0.5 }
  - { t: 700, nudge: 0.5 }
  - { t: 800 }
  - { t: 900 }
  - { t: 1000 }
  - { t: 1100 }
  - { t: 1200 }
  - { t: 1300 }
  - { t: 1400 }
  - { t: 1500 }
  - { t: 1600 }
  - { t: 1700 }
  - { t: 1800 }
  - { t: 1900 }
  - { t: 2000 }
  - { t: 2100 }
  - { t: 2200 }
  - { t: 2300 }
  - { t: 2400 }
  - { t: 2500 }
  - { t: 2600 }
  - { t: 2700 }
  - { t: 2800 }
  - { t: 2900 }
  - { t: 3000 }
  - { t: 3100 }
  - { t: 3200 }
  - { t: 3300 }
  - { t: 3400 }
  - { t: 3500 }
  - { t: 3600 }
  - { t: 3700 }
  - { t: 3800 }
  - { t: 3900 }
  - { t: 4000 }
  - { t: 4100 }
  - { t: 4200 }
  - { t: 4300 }
  - { t: 4400 }
  - { t: 4500 }
expect:
  mode_log:
    - { to: STANDBY, trigger: Command, req: REQ-CMD-001 }
    - { to: DETUMBLE, trigger: Command, req: REQ-CMD-001 }
    - { to: POINTING, trigger: Command, req: REQ-CMD-001 }
    # the retreat, carrying this requirement's id rather than a generic one - the log row is what
    # tells an operator reading it later which rule fired
    - { to: STANDBY, trigger: FaultEntry, req: REQ-ADCS-003 }
  acks:
    - { seq: 3, accepted: true }
  final:
    mode: STANDBY
    # latched and reported, waiting on the ground - running out of wheel is a thing that happened
    # and stays on the record until someone acknowledges it
    faults_set: [WHEEL_SATURATED]
    # the platform is at rest, and the wheel has been unwound rather than left full: the vehicle
    # is ready to be commanded back into POINTING the moment the fault is cleared
    plant_rate_below: 0.05
    wheel_rate_below: 5.0
