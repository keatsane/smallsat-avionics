# a rejected command, end to end: CAPTURE_IMAGE is refused while the vehicle is actively
# detumbling - a spinning platform photographs smear (REQ-CMD-001) - and every command is
# answered in telemetry with a verdict and a reason (REQ-CMD-003). the rejected command must
# change nothing - same mode, no faults.
#
# DETUMBLE is entered by command and holds for the whole timeline because no plant is attached:
# with no rate sample offered, the autonomous exit (REQ-MODE-011) has nothing to count
id: SIL-002
title: illegal-in-mode command is rejected and acked
verifies: [REQ-CMD-001, REQ-CMD-003]
timeline:
  - { t: 100, cmd: { name: SET_MODE, arg: 1, seq: 1 } }
  - { t: 200, cmd: { name: SET_MODE, arg: 2, seq: 2 } }
  - { t: 300, cmd: { name: CAPTURE_IMAGE, arg: 0, seq: 3 } }
  - { t: 500 }
expect:
  mode_log:
    - { to: STANDBY, trigger: Command, req: REQ-CMD-001 }
    - { to: DETUMBLE, trigger: Command, req: REQ-CMD-001 }
  acks:
    - { seq: 1, accepted: true }
    - { seq: 2, accepted: true }
    - { seq: 3, accepted: false, reason: IllegalInMode }
  final:
    mode: DETUMBLE
    faults_set: []
