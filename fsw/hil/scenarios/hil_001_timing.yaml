# HIL-001: leave the link alone for the whole window - heartbeat cadence, framing
# integrity, and seq continuity on the real wire
id: HIL-001
title: heartbeat timing on the live link
verifies: [REQ-VV-003, REQ-TLM-002, REQ-TLM-003]
duration_s: 60
operator: none - leave the board and link untouched for the whole window
expect:
  link: up
  seq_gaps: 0
  crc_rejects: 0
  # tightened once phase 6 replaced the super-loop: the control cycle is now paced by an
  # absolute wake-up, so the beat measured 1.000 s on the bench instead of the 1.02 s the
  # delay-after-work loop drifted to (REQ-RT-002). not tightened further than this - the
  # window has to absorb usb cdc arrival jitter on the host side, which is not the board's
  period_s: { min: 0.9, max: 1.15 }
